  <rect x="490" y="738" width="90" height="24" rx="4" fill="#21262d"/><text x="535" y="755" text-anchor="middle" fill="#3fb950" font-size="9">DexScreener</text>
  <rect x="588" y="738" width="90" height="24" rx="4" fill="#21262d"/><text x="633" y="755" text-anchor="middle" fill="#3fb950" font-size="9">DeFiLlama</text>
  <rect x="686" y="738" width="80" height="24" rx="4" fill="#21262d"/><text x="726" y="755" text-anchor="middle" fill="#3fb950" font-size="9">CoinGecko</text>
  <rect x="774" y="738" width="80" height="24" rx="4" fill="#21262d"/><text x="814" y="755" text-anchor="middle" fill="#3fb950" font-size="9">Solscan</text>
  <rect x="862" y="738" width="80" height="24" rx="4" fill="#21262d"/><text x="902" y="755" text-anchor="middle" fill="#3fb950" font-size="9">Etherscan</text>

