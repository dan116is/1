  <rect x="70" y="705" width="145" height="28" rx="4" fill="#21262d" stroke="#bc8cff" stroke-width="0.5"/>
  <text x="142" y="724" text-anchor="middle" fill="#bc8cff" font-size="10">track_record.json</text>

  <rect x="225" y="705" width="145" height="28" rx="4" fill="#21262d" stroke="#bc8cff" stroke-width="0.5"/>
  <text x="297" y="724" text-anchor="middle" fill="#bc8cff" font-size="10">smart_wallets.json</text>

  <rect x="70" y="740" width="145" height="28" rx="4" fill="#21262d" stroke="#bc8cff" stroke-width="0.5"/>
  <text x="142" y="759" text-anchor="middle" fill="#bc8cff" font-size="10">token_watchlist.json</text>

  <rect x="225" y="740" width="145" height="28" rx="4" fill="#21262d" stroke="#bc8cff" stroke-width="0.5"/>
  <text x="297" y="759" text-anchor="middle" fill="#bc8cff" font-size="10">alpha_signals.json</text>

  <rect x="145" y="775" width="150" height="28" rx="4" fill="#21262d" stroke="#bc8cff" stroke-width="0.5"/>
