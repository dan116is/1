  <rect x="970" y="703" width="10" height="10" rx="2" fill="#3fb950"/><text x="988" y="712" fill="#8b949e" font-size="10">Verification / Data</text>
  <rect x="970" y="721" width="10" height="10" rx="2" fill="#bc8cff"/><text x="988" y="730" fill="#8b949e" font-size="10">Memory System</text>
  <rect x="970" y="739" width="10" height="10" rx="2" fill="#d29922"/><text x="988" y="748" fill="#8b949e" font-size="10">Output / Briefing</text>
