  <line x1="170" y1="240" x2="350" y2="280" stroke="#58a6ff" stroke-width="1" marker-end="url(#arrow)" opacity="0.4"/>
  <line x1="420" y1="240" x2="450" y2="280" stroke="#58a6ff" stroke-width="1" marker-end="url(#arrow)" opacity="0.4"/>
  <line x1="670" y1="240" x2="670" y2="280" stroke="#58a6ff" stroke-width="1" marker-end="url(#arrow)" opacity="0.4"/>
  <line x1="920" y1="240" x2="850" y2="280" stroke="#58a6ff" stroke-width="1" marker-end="url(#arrow)" opacity="0.4"/>

