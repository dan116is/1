<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#58a6ff"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#3fb950"/></marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#bc8cff"/></marker>
    <marker id="arrow-gold" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#d29922"/></marker>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#161b22"/></linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="url(#bg-grad)" rx="16"/>
  <!-- Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40,0 L0,0 0,40" fill="none" stroke="rgba(88,166,255,0.04)" stroke-width="1"/></pattern>
  <rect width="1200" height="850" fill="url(#grid)" rx="16"/>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="700" letter-spacing="2">CRYPTO INTELLIGENCE SYSTEM — ARCHITECTURE</text>
  <text x="600" y="60" text-anchor="middle" fill="#484f58" font-size="11" letter-spacing="1">v1.0 · 6 Agents · 7 Memory Files · 4 Chains</text>

  <!-- ===== ORCHESTRATOR (Center Top) ===== -->
  <rect x="440" y="80" width="320" height="50" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="600" y="110" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">ORCHESTRATOR</text>
  <text x="600" y="96" text-anchor="middle" fill="#484f58" font-size="9">SYSTEM_PROMPT.md</text>

  <!-- Phase Labels -->
  <text x="50" y="170" fill="#484f58" font-size="10" font-weight="600" letter-spacing="1">PHASE 1: PARALLEL SCAN</text>
  <text x="50" y="390" fill="#484f58" font-size="10" font-weight="600" letter-spacing="1">PHASE 2: VERIFY</text>
  <text x="50" y="530" fill="#484f58" font-size="10" font-weight="600" letter-spacing="1">PHASE 3: CALCULATE</text>

  <!-- ===== AGENTS (Phase 1: 1,3,4,5 parallel) ===== -->
  <!-- Agent 1: Social Intel -->
  <rect x="60" y="185" width="220" height="55" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="80" y="207" fill="#58a6ff" font-size="10" font-weight="700">01</text>
  <text x="100" y="207" fill="#e6edf3" font-size="12" font-weight="600">Social Intelligence</text>
  <text x="100" y="225" fill="#8b949e" font-size="10">X/Twitter · News · KOL Tracking</text>

  <!-- Agent 3: Smart Wallets -->
  <rect x="310" y="185" width="220" height="55" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="330" y="207" fill="#58a6ff" font-size="10" font-weight="700">03</text>
  <text x="350" y="207" fill="#e6edf3" font-size="12" font-weight="600">Smart Wallet Tracker</text>
  <text x="350" y="225" fill="#8b949e" font-size="10">Whales · Insiders · Convergence</text>

  <!-- Agent 4: Hyperliquid -->
  <rect x="560" y="185" width="220" height="55" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="580" y="207" fill="#58a6ff" font-size="10" font-weight="700">04</text>
  <text x="600" y="207" fill="#e6edf3" font-size="12" font-weight="600">Hyperliquid Monitor</text>
  <text x="600" y="225" fill="#8b949e" font-size="10">Leaderboard · Positions · Funding</text>

  <!-- Agent 5: Solana Trenches -->
